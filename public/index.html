<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TasteMate Mexican</title>
  <link rel="icon" type="image/png" href="assets/logo/logo-square.png" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header-card">
      <img src="assets/logo/logo-dark.png" alt="TasteMate Logo" class="logo">
      <h1><i>Mexican</i></h1>
      <p class="tagline">Discover flavors you’ll love.</p>

    </header>

    <main>
      <section class="helper-card">
        <div class="helper-header">
          <h3>Not sure what to order? Let us help you find the perfect dish.</h3>
        </div>

        <div class="quick-actions">
          <button class="btn btn-pill" data-category="Popular">Popular</button>
          <button class="btn btn-pill" data-category="Meal">Meals</button>
          <button class="btn btn-pill" data-category="Vegetarian">Vegetarian</button>
          <button class="btn btn-pill" data-category="Spicy">Spicy</button>
          <button class="btn btn-pill" data-category="surprise">Surprise Me!</button>
        </div>
        
        <div class="tag-legend" id="tag-legend">
          <div class="legend-title">Tag Guide</div>
          <div class="legend-items" id="legend-items">
            <!-- Legend items will be generated by JavaScript -->
          </div>
        </div>
        <div id="loading-dots-container" class="loading-dots-container" hidden>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </section>

      <div class="menu-tabs" id="menu-tabs">
        <button class="menu-tab active" data-tab="all">All</button>
        <button class="menu-tab" data-tab="main">Main Dishes</button>
        <button class="menu-tab" data-tab="dessert">Desserts</button>
        <button class="menu-tab" data-tab="drink">Drinks</button>
      </div>

      <section class="menu-list" id="menu-list">
        <!-- Menu items will be injected here by script.js -->
      </section>

      <section class="no-results" id="no-results" hidden>
        <h3>No Dishes Found</h3>
        <p>We couldn't find any dishes matching your search. Try a different search term or clear the filters.</p>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
