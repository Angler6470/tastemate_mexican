<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TasteMate Mexican</title>
  <link rel="icon" type="image/png" href="assets/logo/logo-square.png" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="container-content">
      <header class="header-card">
        <img src="assets/logo/logo-dark.png" alt="TasteMate Logo" class="logo">
        <p class="tagline">A fun way to decide what to eat.</p>
      </header>

      <main>
        <!-- Category Selector -->
        <section class="decision-engine">
          <div class="category-section">
            <label class="section-label">I'm looking for...</label>
            <div class="category-selector" id="category-selector">
              <button class="category-btn active" data-type="meal">Meal</button>
              <button class="category-btn" data-type="dessert">Dessert</button>
              <button class="category-btn" data-type="drink">Drink</button>
            </div>
          </div>

          <!-- Shortcut Buttons -->
          <div class="shortcuts-section">
            <label class="section-label">Choose a shortcut</label>
            <div class="shortcuts-grid" id="shortcuts-grid">
              <button class="shortcut-btn" data-shortcut="surprise">
                <span class="shortcut-icon">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" class="shortcut-svg">
                    <rect x="3" y="3" width="18" height="18" rx="4"/>
                    <circle cx="9" cy="9" r="1.5" fill="currentColor"/>
                    <circle cx="15" cy="15" r="1.5" fill="currentColor"/>
                    <circle cx="15" cy="9" r="1.5" fill="currentColor"/>
                  </svg>
                </span>
                <span class="shortcut-label">Surprise Me</span>
              </button>
              <button class="shortcut-btn" data-shortcut="favorite">
                <span class="shortcut-icon">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" class="shortcut-svg">
                    <path d="M12 3l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 18l-5.9 3 1.2-6.5L2.5 9.9l6.6-.9L12 3z"/>
                  </svg>
                </span>
                <span class="shortcut-label">House Favorite</span>
              </button>
              <button class="shortcut-btn" data-shortcut="comfort">
                <span class="shortcut-icon">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" class="shortcut-svg">
                    <path d="M20.8 6.6a4.5 4.5 0 0 0-6.4 0L12 9l-2.4-2.4a4.5 4.5 0 1 0-6.4 6.4L12 21l8.8-8.8a4.5 4.5 0 0 0 0-6.4z"/>
                  </svg>
                </span>
                <span class="shortcut-label">Comfort Pick</span>
              </button>
              <button class="shortcut-btn" data-shortcut="different">
                <span class="shortcut-icon">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" class="shortcut-svg">
                    <path d="M9 18h6"/>
                    <path d="M10 22h4"/>
                    <path d="M12 2a7 7 0 0 0-4 12c.6.5 1 1.2 1 2h6c0-.8.4-1.5 1-2a7 7 0 0 0-4-12z"/>
                  </svg>
                </span>
                <span class="shortcut-label">Try Something New</span>
              </button>
            </div>
          </div>
        </section>

        <!-- Recommendation Spotlight -->
        <section id="recommendation-spotlight" class="recommendation-spotlight" hidden>
          <div class="spotlight-header">
            <h3 class="spotlight-title">Our Recommendation</h3>
          </div>
          <div id="spotlight-container">
            <!-- Recommendation card will be injected here -->
          </div>
          <div class="spotlight-actions">
            <button id="try-another-btn" class="btn-secondary">Try Another</button>
            <button id="show-menu-btn" class="btn-secondary">Show Full Menu</button>
          </div>
        </section>

        <!-- Full Menu Modal -->
        <div id="menu-modal" class="modal-overlay" hidden>
          <div class="modal-container">
            <header class="modal-header">
              <h3>Full Menu</h3>
              <button id="modal-close" class="btn-close">&times;</button>
            </header>
            
            <nav class="modal-tabs" id="modal-category-tabs">
              <button class="modal-tab-btn active" data-tab="meal">Meals</button>
              <button class="modal-tab-btn" data-tab="dessert">Desserts</button>
              <button class="modal-tab-btn" data-tab="drink">Drinks</button>
            </nav>

            <div class="modal-body">
              <section class="menu-list" id="menu-list">
                <!-- Menu items will be injected here -->
              </section>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
