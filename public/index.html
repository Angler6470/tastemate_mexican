<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TasteMate Mexican</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header-card">
      <img src="assets/logo/logo-dark.png" alt="TasteMate Logo" class="logo">
      <h1>TasteMate</h1>
      <p class="tagline">Mexican</p>

    </header>

    <main>
      <section class="helper-card">
        <h2>Not sure what to get?</h2>
        <p>Let us help you find the perfect dish.</p>
        <button class="btn btn-primary">Help Me Choose</button>
        <div class="quick-actions">
          <button class="btn btn-pill">Spicy</button>
          <button class="btn btn-pill">Fast</button>
          <button class="btn btn-pill">Surprise</button>
        </div>
      </section>

      <section class="menu-list" id="menu-list">
        <!-- Menu items will be injected here by script.js -->
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
