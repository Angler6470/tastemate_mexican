<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TasteMate Mexican</title>
  <link rel="icon" type="image/png" href="assets/logo/logo-square.png" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="container-content">
      <header class="header-card">
        <img src="assets/logo/logo-dark.png" alt="TasteMate Logo" class="logo">
        <i><p class="tagline">Discover Mexican Flavors You'll Love.</p></i>
      </header>

      <main>
      <section class="helper-card">
        <div class="helper-header">
          <h3>Not sure what to order?</h3>
          <button class="btn btn-primary-action" data-category="surprise">Help Me Choose</button>
        </div>

        <div class="filter-block filter-block--sections">
          <label class="filter-block-label">Browse sections</label>
          <div class="filter-group filter-group--segmented">
            <button class="filter-btn filter-btn--segmented active" data-tab="all">All</button>
            <button class="filter-btn filter-btn--segmented" data-tab="main">Main Dishes</button>
            <button class="filter-btn filter-btn--segmented" data-tab="dessert">Desserts</button>
            <button class="filter-btn filter-btn--segmented" data-tab="drink">Drinks</button>
          </div>
        </div>

        <div class="filter-block filter-block--tags">
          <label class="filter-block-label">Filter by tags</label>
          <div class="filter-group filter-group--chips">
            <button class="filter-btn filter-btn--chip" data-category="Popular">Popular</button>
            <button class="filter-btn filter-btn--chip" data-category="Vegetarian">Vegetarian</button>
            <button class="filter-btn filter-btn--chip" data-category="Spicy">Spicy</button>
            <button class="filter-btn filter-btn--chip" data-category="Sweet">Sweet</button>
          </div>
        </div>
        
        <div class="tag-guide-section">
          <button class="tag-guide-toggle" id="tag-guide-toggle">
            <span class="tag-guide-icon">i</span>
            <span class="tag-guide-text">What do these tags mean?</span>
          </button>
          
          <div class="tag-legend" id="tag-legend" hidden>
            <div class="legend-items" id="legend-items">
              <!-- Legend items will be generated by JavaScript -->
            </div>
          </div>
        </div>
        
        <div id="loading-dots-container" class="loading-dots-container" hidden style="display: none;">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </section>

      <section class="menu-list" id="menu-list">
        <!-- Menu items will be injected here by script.js -->
      </section>

      <section class="no-results" id="no-results" hidden>
        <h3>No Dishes Found</h3>
        <p>We couldn't find any dishes matching your search. Try a different search term or clear the filters.</p>
      </section>
    </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
